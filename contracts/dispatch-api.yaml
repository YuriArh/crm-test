  schemas:
    Problem:
      type: object
      description: |
        Problem Details (RFC 9457) with the project's `code`. `type` is omitted when it is `about:blank`.
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Machine-readable error code: `VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`,
            `IDEMPOTENCY_KEY_REUSED`, `UNAUTHENTICATED`, `BAD_CREDENTIALS`, `FORBIDDEN`, `CSRF_INVALID`, `NOT_FOUND`,
            `VERSION_CONFLICT`, `INVALID_STATE`, `INVALID_ASSIGNEE`, `INTERNAL_ERROR`, or the HTTP status
            name for framework errors.
        errors:
          type: array
          description: Field errors of `VALIDATION_FAILED` for a body.
          items:
            $ref: '#/components/schemas/FieldError'
        current:
          $ref: '#/components/schemas/RequestCard'
          description: The current card, on `VERSION_CONFLICT` of a request.

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    SystemInfo:
      type: object
      required: [application, serverTime, businessTimezone]
      properties:
        application:
          type: string
        serverTime:
          type: string
          format: date-time
        businessTimezone:
          type: string
          description: IANA time zone id used for dates, deadlines and overdue.

    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
        token:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    Role:
      type: string
      enum: [INITIATOR, OPERATOR]

    Me:
      type: object
      required: [id, username, displayName, role, service]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        service:
          $ref: '#/components/schemas/ServiceRef'

    ServiceRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    UserSummary:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string

    PersonRef:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    BusinessStatus:
      type: string
      enum: [AWAITING, IN_PROGRESS, SUCCEEDED, REJECTED]
      description: |
        Business result reported by the carrier. `AWAITING` — no result yet; `IN_PROGRESS` — taken into
        work; `SUCCEEDED` and `REJECTED` are final.

    DeliveryStatus:
      type: string
      enum: [PENDING, SENDING, RETRY_WAIT, UNKNOWN, ACKNOWLEDGED, FAILED]
      description: |
        Whether the request reached the carrier (receipt is not execution). `PENDING` — waiting to be
        sent; `SENDING` — being sent; `RETRY_WAIT` — temporary error, waiting for the next attempt;
        `UNKNOWN` — no answer after sending, unknown whether the carrier got it; `ACKNOWLEDGED` — the
        carrier confirmed receipt; `FAILED` — permanent error or attempts exhausted.

    RequestListItem:
      type: object
      required: [id, number, cargoDescription, deadline, businessStatus, deliveryStatus, overdue, owner,
                 assignee, createdAt, openProblems]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Human-readable number, e.g. `DR-000123`.
        cargoDescription:
          type: string
        deadline:
          type: string
          format: date
        businessStatus:
          $ref: '#/components/schemas/BusinessStatus'
        deliveryStatus:
          $ref: '#/components/schemas/DeliveryStatus'
        overdue:
          type: boolean
        owner:
          $ref: '#/components/schemas/PersonRef'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        openProblems:
          type: [integer, 'null']
          minimum: 0
          description: Open problems of the request; `null` for initiators, who never see problems.

    RequestPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestListItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CreateRequest:
      type: object
      required: [cargoDescription, weightKg, deliveryAddress, deadline]
      properties:
        cargoDescription:
          type: string
          minLength: 1
          maxLength: 200
        weightKg:
          type: number
          minimum: 0.1
          maximum: 20000
          description: Kilograms, at most one decimal place.
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 500
        deadline:
          type: string
          format: date
          description: Not before today in the business time zone.

    UpdateRequest:
      type: object
      additionalProperties: false
      description: Send `version` and at least one of `assigneeId`, `comment`.
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        assigneeId:
          type: [string, 'null']
          format: uuid
          description: Operator of the request's service; `null` removes the assignee.
        comment:
          type: [string, 'null']
          maxLength: 2000
          description: Stored stripped; an empty string or `null` removes the comment.

    BusinessResult:
      type: object
      description: '`SUCCEEDED` has `trackingNumber` and `price`; `REJECTED` has `rejectionReason`.'
      required: [trackingNumber, price, rejectionReason, resultAt]
      properties:
        trackingNumber:
          type: [string, 'null']
        price:
          type: [number, 'null']
          description: Rubles.
        rejectionReason:
          type: [string, 'null']
        resultAt:
          type: [string, 'null']
          format: date-time

    ExchangeInfo:
      type: object
      description: Technical exchange state; operators only.
      required: [attempts, nextAttemptAt, lastError, acknowledgedAt, acknowledgedVia]
      properties:
        attempts:
          type: integer
          description: Send attempts made so far.
        nextAttemptAt:
          type: [string, 'null']
          format: date-time
        lastError:
          type: [string, 'null']
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
        acknowledgedVia:
          description: How receipt became known.
          oneOf:
            - type: string
              enum: [RESPONSE, RESULT, RECONCILIATION]
            - type: 'null'

    RequestCard:
      type: object
      required: [id, number, cargoDescription, weightKg, deliveryAddress, deadline, comment, owner, assignee,
                 businessStatus, result, deliveryStatus, operationId, overdue, createdAt, updatedAt, version,
                 actions]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        cargoDescription:
          type: string
        weightKg:
          type: number
        deliveryAddress:
          type: string
        deadline:
          type: string
          format: date
        comment:
          type: [string, 'null']
        owner:
          $ref: '#/components/schemas/PersonRef'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        businessStatus:
          $ref: '#/components/schemas/BusinessStatus'
        result:
          description: '`null` until the carrier reports a final result.'
          oneOf:
            - $ref: '#/components/schemas/BusinessResult'
            - type: 'null'
        deliveryStatus:
          $ref: '#/components/schemas/DeliveryStatus'
        operationId:
          type: string
          format: uuid
          description: Immutable business operation identity used in the exchange with the carrier.
        overdue:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Send it back in `PATCH`.
        exchange:
          $ref: '#/components/schemas/ExchangeInfo'
        actions:
          type: array
          description: Operator actions the request's state allows now; always empty for initiators.
          items:
            $ref: '#/components/schemas/RequestAction'
        problems:
          type: array
          description: Problems of the request, open and resolved, newest first. Operators only.
          items:
            $ref: '#/components/schemas/ExchangeProblem'
        reconciliations:
          type: array
          description: The latest reconciliation checks of the request (at most 20), newest first. Operators only.
          maxItems: 20
          items:
            $ref: '#/components/schemas/Reconciliation'

    RequestAction:
      type: string
      enum: [RETRY, RECONCILE]
      description: |
        `RETRY` — retry the delivery (it is `FAILED` or `UNKNOWN`, or the carrier lost an acknowledged operation
        and there is no result); `RECONCILE` — reconcile now (always offered to an operator).

    ProblemKind:
      type: string
      enum: [DELIVERY_UNKNOWN, DELIVERY_FAILED, INVALID_MESSAGE, MESSAGE_FAILED, RESULT_CONFLICT, EXTERNAL_MISSING,
             RECONCILIATION_CONFLICT]
      description: |
        `DELIVERY_UNKNOWN` — unknown whether the carrier got the request (closed by the system once delivery is
        confirmed); `DELIVERY_FAILED` — delivery failed (attempts exhausted or refused); `INVALID_MESSAGE` — the
        carrier sent a record that breaks the contract; `MESSAGE_FAILED` — `dispatch` could not process a record;
        `RESULT_CONFLICT` — a record disagrees with the applied result; `EXTERNAL_MISSING` — reconciliation: the
        carrier does not know an operation it acknowledged (closed by the system once it knows it again);
        `RECONCILIATION_CONFLICT` — reconciliation: the carrier's result differs from ours, or only we have one
        (closed by the system once they match).

    ProblemStatus:
      type: string
      enum: [OPEN, RESOLVED]

    ProblemDecision:
      type: string
      enum: [SYSTEM, RETRIED, APPLY_CARRIER, KEEP_OURS, ACKNOWLEDGED]
      description: |
        How the problem was closed: `SYSTEM` — by the system (delivery confirmed, the carrier knows the operation,
        the results match); `RETRIED` — an operator retried the delivery; `APPLY_CARRIER` — an operator applied the
        carrier's result; `KEEP_OURS` — an operator kept our result; `ACKNOWLEDGED` — an operator looked into the
        record.

    RequestRef:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string

    ProblemMessage:
      type: object
      description: |
        The carrier record behind the problem: the fields that could be read (each `null` when it could not)
        and the beginning of the raw text, with control characters escaped.
      required: [messageId, feedSeq, status, sequence, trackingNumber, price, reason, occurredAt, payloadExcerpt]
      properties:
        messageId:
          type: [string, 'null']
        feedSeq:
          type: [integer, 'null']
          format: int64
        status:
          type: [string, 'null']
        sequence:
          type: [integer, 'null']
        trackingNumber:
          type: [string, 'null']
        price:
          type: [number, 'null']
        reason:
          type: [string, 'null']
        occurredAt:
          type: [string, 'null']
          format: date-time
        payloadExcerpt:
          type: string
          maxLength: 2000

    CurrentResult:
      type: object
      description: The request's result now, to compare with a disputed record.
      required: [businessStatus, result]
      properties:
        businessStatus:
          $ref: '#/components/schemas/BusinessStatus'
        result:
          oneOf:
            - $ref: '#/components/schemas/BusinessResult'
            - type: 'null'

    ResultSnapshot:
      type: object
      description: A final result as it was at some moment.
      required: [status, trackingNumber, price, reason]
      properties:
        status:
          type: string
          enum: [SUCCEEDED, REJECTED]
        trackingNumber:
          type: [string, 'null']
        price:
          type: [number, 'null']
        reason:
          type: [string, 'null']

    OurSide:
      type: object
      description: Our side of a problem as it was then.
      required: [result]
      properties:
        result:
          description: Our final result; `null` when we had none.
          oneOf:
            - $ref: '#/components/schemas/ResultSnapshot'
            - type: 'null'

    ExchangeProblem:
      type: object
      required: [id, kind, status, details, openedAt, resolvedAt, request, operationId, message, currentResult,
                 ourSide, resolvedBy, decision, comment, actions]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ProblemKind'
        status:
          $ref: '#/components/schemas/ProblemStatus'
        details:
          type: string
          description: Why it was opened.
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        request:
          description: '`null` for a record that names no known request.'
          oneOf:
            - $ref: '#/components/schemas/RequestRef'
            - type: 'null'
        operationId:
          type: [string, 'null']
          format: uuid
        message:
          description: |
            The carrier's side: the record for `INVALID_MESSAGE`, `MESSAGE_FAILED`, `RESULT_CONFLICT`; for
            `RECONCILIATION_CONFLICT` the carrier's latest answer (its result fields, `null` when it has no result;
            `feedSeq` is `null`); otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/ProblemMessage'
            - type: 'null'
        currentResult:
          description: |
            For `RESULT_CONFLICT`, `RECONCILIATION_CONFLICT` and `EXTERNAL_MISSING`; otherwise `null`. The request's
            result now: after a decision it may already be the carrier's. Compare the carrier's side with `ourSide`.
          oneOf:
            - $ref: '#/components/schemas/CurrentResult'
            - type: 'null'
        ourSide:
          description: |
            Our result when the problem was opened (for `RECONCILIATION_CONFLICT`: at its latest check while it is
            open), kept as history and never changed after it is closed. `null` when the kind has no two sides or
            the problem is older than this snapshot.
          oneOf:
            - $ref: '#/components/schemas/OurSide'
            - type: 'null'
        resolvedBy:
          description: The operator who closed it; `null` while open or when the system closed it.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decision:
          oneOf:
            - $ref: '#/components/schemas/ProblemDecision'
            - type: 'null'
        comment:
          type: [string, 'null']
        actions:
          type: array
          description: Decisions an operator may take now; decided by the server.
          items:
            $ref: '#/components/schemas/ProblemDecision'

    ResolveProblem:
      type: object
      additionalProperties: false
      required: [decision, comment]
      properties:
        decision:
          type: string
          enum: [APPLY_CARRIER, KEEP_OURS, ACKNOWLEDGED]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          description: The ground for the decision; stored stripped, must not be blank.

    Reconciliation:
      type: object
      description: One reconciliation check of a request's operation with the carrier.
      required: [id, checkedAt, trigger, performedBy, outcome, acknowledged, localResult, carrierState, carrierResult,
                 details]
      properties:
        id:
          type: string
          format: uuid
        checkedAt:
          type: string
          format: date-time
        trigger:
          type: string
          enum: [STARTUP, SCHEDULED, MANUAL]
          description: '`MANUAL` — an operator''s «reconcile now»; the others are background passes.'
        performedBy:
          description: The operator of a manual check; `null` for background checks.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        outcome:
          type: string
          enum: [MATCH, EXTERNAL_AHEAD, EXTERNAL_MISSING, CONFLICT, ERROR]
          description: |
            `MATCH` — nothing to fix; `EXTERNAL_AHEAD` — the carrier had a result we did not, it was taken over;
            `EXTERNAL_MISSING` — the carrier does not know the operation; `CONFLICT` — the results differ, or only
            we have one; `ERROR` — the carrier did not answer or answered against the contract.
        acknowledged:
          type: boolean
          description: Whether this check confirmed the delivery.
        localResult:
          description: Our final result when the check was decided; `null` when we had none.
          oneOf:
            - $ref: '#/components/schemas/ResultSnapshot'
            - type: 'null'
        carrierState:
          description: What the carrier said about the operation; `null` when it did not answer.
          oneOf:
            - type: string
              enum: [ACCEPTED, EXECUTED, NOT_FOUND]
            - type: 'null'
        carrierResult:
          description: The carrier's final result; `null` when it has none.
          oneOf:
            - $ref: '#/components/schemas/ReconciliationCarrierResult'
            - type: 'null'
        details:
          type: string
          description: Why the check concluded what it did, the carrier's own error text and the start of its answer.

    ReconciliationCarrierResult:
      type: object
      required: [status, trackingNumber, price, reason, sequence, messageId, occurredAt]
      properties:
        status:
          type: string
          enum: [SUCCEEDED, REJECTED]
        trackingNumber:
          type: [string, 'null']
        price:
          type: [number, 'null']
        reason:
          type: [string, 'null']
        sequence:
          type: integer
        messageId:
          type: string
        occurredAt:
          type: string
          format: date-time

    HistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        nextCursor:
          type: [string, 'null']
          description: Pass it as `before` for the next (older) page; `null` on the last page.

    HistoryKind:
      type: string
      enum: [CREATED, EDITED, RESULT_CHANGED, DELIVERY_ACKNOWLEDGED, DELIVERY_RETRIED, SEND_ATTEMPT, RESULT_RECEIVED,
             RECONCILIATION, PROBLEM_OPENED, PROBLEM_RESOLVED]
      description: |
        `CREATED` — the request was created; `EDITED` — its comment or assignee changed; `RESULT_CHANGED` — its
        result changed (from the carrier, or the carrier's version an operator applied); `DELIVERY_ACKNOWLEDGED` —
        the carrier confirmed receipt; `DELIVERY_RETRIED` — an operator retried the delivery; `SEND_ATTEMPT` — an
        attempt to send; `RESULT_RECEIVED` — a carrier record and how it was processed; `RECONCILIATION` — a
        reconciliation check; `PROBLEM_OPENED`, `PROBLEM_RESOLVED` — a problem of the exchange and its decision.

    HistoryEntry:
      description: One entry; the fields after `actor` depend on `kind` (each variant fixes its `kind`).
      oneOf:
        - $ref: '#/components/schemas/HistoryCreated'
        - $ref: '#/components/schemas/HistoryEdited'
        - $ref: '#/components/schemas/HistoryResultChanged'
        - $ref: '#/components/schemas/HistoryDeliveryAcknowledged'
        - $ref: '#/components/schemas/HistoryDeliveryRetried'
        - $ref: '#/components/schemas/HistorySendAttempt'
        - $ref: '#/components/schemas/HistoryResultReceived'
        - $ref: '#/components/schemas/HistoryReconciliation'
        - $ref: '#/components/schemas/HistoryProblemOpened'
        - $ref: '#/components/schemas/HistoryProblemResolved'

    HistoryEntryId:
      type: string
      format: uuid
      description: |
        The id of what the entry is about: the request (`CREATED`), the event (`EDITED`, `RESULT_CHANGED`,
        `DELIVERY_RETRIED`), the operation (`DELIVERY_ACKNOWLEDGED`), the attempt, the carrier record, the check,
        the problem. Unique together with `kind`.

    HistoryActor:
      description: Who did it; `null` — the system.
      oneOf:
        - $ref: '#/components/schemas/PersonRef'
        - type: 'null'

    HistoryCreated:
      type: object
      required: [id, kind, at, actor]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: CREATED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'

    HistoryEdited:
      type: object
      required: [id, kind, at, actor, version, changes]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: EDITED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        version:
          type: integer
          format: int64
          description: The version of the request this change made.
        changes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldChange'

    HistoryResultChanged:
      type: object
      required: [id, kind, at, actor, version, changes, recordId, problemId]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: RESULT_CHANGED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        version:
          type: integer
          format: int64
        changes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldChange'
        recordId:
          type: [string, 'null']
          format: uuid
          description: The carrier record whose result was applied; `null` for an initiator.
        problemId:
          type: [string, 'null']
          format: uuid
          description: The problem an operator applied it in; `null` otherwise and for an initiator.

    HistoryDeliveryAcknowledged:
      type: object
      required: [id, kind, at, actor, via]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: DELIVERY_ACKNOWLEDGED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        via:
          description: How receipt became known; `null` for an initiator.
          oneOf:
            - type: string
              enum: [RESPONSE, RESULT, RECONCILIATION]
            - type: 'null'

    HistoryDeliveryRetried:
      type: object
      required: [id, kind, at, actor, changes]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: DELIVERY_RETRIED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        changes:
          type: array
          description: The delivery status the retry found and left (`UNKNOWN` stays `UNKNOWN`).
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldChange'

    HistorySendAttempt:
      type: object
      required: [id, kind, at, actor, attemptNo, outcome, httpStatus, error, durationMs, finishedAt]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: SEND_ATTEMPT
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        attemptNo:
          type: integer
        outcome:
          description: '`null` while the attempt is in progress.'
          oneOf:
            - type: string
              enum: [ACKNOWLEDGED, TEMPORARY_ERROR, UNKNOWN, PERMANENT_ERROR, PAYLOAD_CONFLICT]
            - type: 'null'
        httpStatus:
          type: [integer, 'null']
        error:
          type: [string, 'null']
        durationMs:
          type: [integer, 'null']
        finishedAt:
          type: [string, 'null']
          format: date-time

    HistoryResultReceived:
      type: object
      required: [id, kind, at, actor, recordId, source, resultStatus, sequence, processingStatus, reason, duplicates,
                 lastDuplicateAt, receivedAt]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: RESULT_RECEIVED
        at:
          type: string
          format: date-time
          description: When it was processed (when it was received, for records older than the history).
        actor:
          $ref: '#/components/schemas/HistoryActor'
        recordId:
          type: string
          format: uuid
        source:
          type: string
          enum: [FEED, RECONCILIATION]
        resultStatus:
          type: [string, 'null']
          description: The record's result status, `null` when it could not be read.
        sequence:
          type: [integer, 'null']
        processingStatus:
          type: string
          enum: [RECEIVED, APPLIED, STALE, CONFLICT, INVALID, FAILED]
        reason:
          type: [string, 'null']
        duplicates:
          type: integer
          description: How many times the same message came again (no effect).
        lastDuplicateAt:
          type: [string, 'null']
          format: date-time
        receivedAt:
          type: string
          format: date-time

    HistoryReconciliation:
      type: object
      required: [id, kind, at, actor, trigger, outcome, details]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: RECONCILIATION
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        trigger:
          type: string
          enum: [STARTUP, SCHEDULED, MANUAL]
        outcome:
          type: string
          enum: [MATCH, EXTERNAL_AHEAD, EXTERNAL_MISSING, CONFLICT, ERROR]
        details:
          type: string

    HistoryProblemOpened:
      type: object
      required: [id, kind, at, actor, problemId, problemKind]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: PROBLEM_OPENED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        problemId:
          type: string
          format: uuid
        problemKind:
          $ref: '#/components/schemas/ProblemKind'

    HistoryProblemResolved:
      type: object
      required: [id, kind, at, actor, problemId, problemKind, decision, comment]
      properties:
        id:
          $ref: '#/components/schemas/HistoryEntryId'
        kind:
          const: PROBLEM_RESOLVED
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/HistoryActor'
        problemId:
          type: string
          format: uuid
        problemKind:
          $ref: '#/components/schemas/ProblemKind'
        decision:
          $ref: '#/components/schemas/ProblemDecision'
        comment:
          type: [string, 'null']

    FieldChange:
      description: One field of a change, before and after.
      oneOf:
        - $ref: '#/components/schemas/ValueChange'
        - $ref: '#/components/schemas/AssigneeChange'

    ValueChange:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
          enum: [comment, businessStatus, trackingNumber, price, rejectionReason, deliveryStatus]
          description: '`price` is a decimal number written as text, without trailing zeros.'
        from:
          type: [string, 'null']
        to:
          type: [string, 'null']

    AssigneeChange:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
          enum: [assignee]
        from:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        to:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'

    ExchangeProblemPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeProblem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
