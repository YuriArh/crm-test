openapi: 3.1.0
info:
  title: Dispatch API
  version: 1.0.0
  license:
    name: Proprietary (test assignment)
    identifier: LicenseRef-Proprietary
  description: |
    API of `dispatch` for the web client (`web/`). The UI and the API share one origin
    (Vite proxy in development, nginx in Docker), so there is no CORS.

    ## Session and CSRF

    - Sign-in creates a server session (cookie `SESSION`). The session is kept in the database, so it
      survives a restart of `dispatch`; it ends at sign-out or after 30 minutes without requests, and then every
      call answers `401` and the user signs in again.
    - Every mutating call (`POST`, `PATCH`) needs the header `X-XSRF-TOKEN` with the value of the cookie
      `XSRF-TOKEN`. `GET /api/auth/csrf` sets the cookie. The token changes after login and the cookie is
      cleared on logout, so the client reads the cookie right before each mutating call.
    - A missing or wrong token gives `403 CSRF_INVALID` even before authentication is checked; the client
      fetches a fresh token and may repeat the call. A `403 FORBIDDEN` is a real denial: repeating cannot help.

    ## Access scope

    The scope comes only from the session user, never from parameters. An `INITIATOR` sees and creates
    own requests; an `OPERATOR` sees all requests of their service and assigns them. A request outside
    the caller's scope answers `404 NOT_FOUND`, the same as a missing one.

    ## Errors

    Every error is Problem Details (RFC 9457, `application/problem+json`) with a machine-readable `code`.
    Validation errors of a body carry `errors: [{field, message}]`. Framework errors (`405`, `415`, …)
    have `code` equal to the HTTP status name, e.g. `METHOD_NOT_ALLOWED`.

    ## Idempotency and concurrent changes

    - `POST /api/requests` needs an `Idempotency-Key` header (client-generated, at most 100 characters,
      scoped per user). A repeat with the same key and the same body replays the stored response with
      `Idempotent-Replayed: true` and creates nothing; the same key with another body gives
      `422 IDEMPOTENCY_KEY_REUSED`.
    - `PATCH /api/requests/{id}` carries the `version` the client has seen. If the request has changed
      since, the answer is `409 VERSION_CONFLICT` with the current card in `current`; nothing is
      overwritten silently.

    ## Time

    Instants are ISO-8601 UTC (`2026-11-12T09:15:03Z`). Dates (`deadline`) are `YYYY-MM-DD` in the
    business time zone, published by `GET /api/system/info`. A request is overdue when it has no final
    result and today in the business time zone is after its deadline.
servers:
  - url: http://localhost:8080
    description: Local dispatch
security:
  - session: []
tags:
  - name: system
    description: Public information about the running application.
  - name: auth
    description: Session sign-in and the current user.
  - name: users
    description: Users shown in pickers.
  - name: requests
    description: Delivery requests.
  - name: problems
    description: Problems of the exchange that need an operator, and the operator's decisions.

paths:
  /api/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Application name, server time and business time zone
      security: []
      responses:
        '200':
          description: Information about the running application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              examples:
                info:
                  value:
                    application: dispatch
                    serverTime: '2026-11-12T09:15:03Z'
                    businessTimezone: Europe/Moscow

  /api/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Issue a CSRF token
      description: Sets the `XSRF-TOKEN` cookie and returns the same raw token.
      security: []
      responses:
        '200':
          description: The token and the header to send it in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              examples:
                token:
                  value:
                    headerName: X-XSRF-TOKEN
                    token: 3f1c2b4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      description: |
        Creates a session (the session id changes) and rotates the CSRF token. Unknown user, wrong password
        and disabled account all answer the same `401 BAD_CREDENTIALS`.
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              initiator:
                value:
                  username: north.initiator
                  password: demo1234
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                initiator:
                  $ref: '#/components/examples/MeInitiator'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                badCredentials:
                  value:
                    title: Wrong username or password
                    status: 401
                    detail: Wrong username or password
                    instance: /api/auth/login
                    code: BAD_CREDENTIALS
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      security:
        - session: []
          csrf: []
      description: Invalidates the session and clears the CSRF cookie; fetch a new token afterwards.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                operator:
                  $ref: '#/components/examples/MeOperator'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/users/operators:
    get:
      tags: [users]
      operationId: listOperators
      summary: Operators of the caller's service
      description: Enabled operators of the caller's own service — the choices for an assignee. Operators only.
      responses:
        '200':
          description: Operators, possibly none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
              examples:
                north:
                  value:
                    - id: 0195f3a2-0000-7000-8000-000000000102
                      username: north.operator
                      displayName: Оператор (Север)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Request registry
      description: A page of the requests in the caller's scope. One value per filter.
      parameters:
        - name: businessStatus
          in: query
          schema:
            $ref: '#/components/schemas/BusinessStatus'
        - name: deliveryStatus
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: hasOpenProblems
          in: query
          description: |
            Operators only (an initiator gets `403`): `true` — requests with an open problem, `false` — without one.
          schema:
            type: boolean
        - name: page
          in: query
          description: Page number, from 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: '`field,asc|desc`; the direction defaults to `asc`.'
          schema:
            type: string
            pattern: '^(createdAt|deadline|number)(,(asc|desc))?$'
            default: createdAt,desc
      responses:
        '200':
          description: One page of the registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
              examples:
                onePage:
                  value:
                    items:
                      - id: 0195f3a2-7c41-7d10-9a5e-3f1c2b4d5e60
                        number: DR-000123
                        cargoDescription: Паллеты
                        deadline: '2026-12-01'
                        businessStatus: AWAITING
                        deliveryStatus: ACKNOWLEDGED
                        overdue: false
                        owner:
                          id: 0195f3a2-0000-7000-8000-000000000101
                          displayName: Инициатор (Север)
                        assignee: null
                        createdAt: '2026-11-12T09:15:03Z'
                        openProblems: 0
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [requests]
      operationId: createRequest
      summary: Create a request
      security:
        - session: []
          csrf: []
      description: |
        Initiators only. The request is saved and queued for sending to the carrier in one transaction;
        its content never changes afterwards. The deadline must not be before today in the business time
        zone.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key of this create action (e.g. a UUID), at most 100 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            examples:
              pallets:
                value:
                  cargoDescription: Паллеты
                  weightKg: 12.5
                  deliveryAddress: ул. Ленина, 1
                  deadline: '2026-12-01'
      responses:
        '201':
          description: Created, or the replay of an earlier create with the same key and body.
          headers:
            Location:
              description: URL of the request card.
              schema:
                type: string
            Idempotent-Replayed:
              description: '`true` when this response was replayed for a repeated `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCard'
              examples:
                created:
                  $ref: '#/components/examples/CardNew'
        '400':
          description: Invalid body, or no `Idempotency-Key` header (`IDEMPOTENCY_KEY_REQUIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  $ref: '#/components/examples/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: The body is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unsupported:
                  value:
                    title: Unsupported Media Type
                    status: 415
                    detail: Content-Type 'text/plain;charset=UTF-8' is not supported.
                    instance: /api/requests
                    code: UNSUPPORTED_MEDIA_TYPE
        '422':
          description: The `Idempotency-Key` was already used with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                keyReused:
                  value:
                    title: Idempotency-Key was already used with a different request
                    status: 422
                    detail: Idempotency-Key was already used with a different request
                    instance: /api/requests
                    code: IDEMPOTENCY_KEY_REUSED

  /api/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Request id. A malformed id answers `404`, like a missing request.
        schema:
          type: string
    get:
      tags: [requests]
      operationId: getRequest
      summary: Request card
      description: |
        `exchange`, `problems` and `reconciliations` are present for operators only; `actions` is empty for
        initiators.
      responses:
        '200':
          description: The request card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCard'
              examples:
                succeeded:
                  $ref: '#/components/examples/CardSucceeded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [requests]
      operationId: updateRequest
      summary: Change the comment and/or the assignee
      security:
        - session: []
          csrf: []
      description: |
        A field that is not sent is kept; an explicit `null` clears it. Unknown fields are rejected.
        Anyone who can see the request may change the comment; only an operator of its service may change
        the assignee. Sending the current values changes nothing and does not bump `version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
            examples:
              assign:
                value:
                  version: 3
                  assigneeId: 0195f3a2-0000-7000-8000-000000000102
              clearComment:
                value:
                  version: 3
                  comment: null
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCard'
              examples:
                succeeded:
                  $ref: '#/components/examples/CardSucceeded'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `VERSION_CONFLICT`: the request was changed by someone else. `current` holds the current card
            when the conflict is found by the version check.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                versionConflict:
                  value:
                    title: The object was changed by someone else
                    status: 409
                    detail: Request DR-000123 was changed by someone else
                    instance: /api/requests/0195f3a2-7c41-7d10-9a5e-3f1c2b4d5e60
                    code: VERSION_CONFLICT
        '422':
          description: '`INVALID_ASSIGNEE`: the assignee is not an enabled operator of the same service.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidAssignee:
                  value:
                    title: Assignee must be an operator of the same service
                    status: 422
                    detail: Assignee must be an operator of the same service
                    instance: /api/requests/0195f3a2-7c41-7d10-9a5e-3f1c2b4d5e60
                    code: INVALID_ASSIGNEE

  /api/requests/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        description: Request id. A malformed id answers `404`, like a missing request.
        schema:
          type: string
    post:
      tags: [problems]
      operationId: retryDelivery
      summary: Retry the delivery
      security:
        - session: []
          csrf: []
      description: |
        Operators of the request's service only. Allowed while `actions` of the card has `RETRY`: the delivery
        is `FAILED` or `UNKNOWN`, or it is `ACKNOWLEDGED` but the carrier lost the operation (an open
        `EXTERNAL_MISSING`) and the request has no final result. Starts a new budget of retries and sends at
        once, with the same `operationId`: the carrier never executes one operation twice. `FAILED` and
        `ACKNOWLEDGED` become `PENDING`; `UNKNOWN` stays `UNKNOWN` until the carrier confirms receipt. Open
        `DELIVERY_FAILED` and `EXTERNAL_MISSING` problems are closed as `RETRIED`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key of this action, at most 100 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The card after the retry, or the replay of an earlier retry with the same key.
          headers:
            Idempotent-Replayed:
              description: '`true` when this response was replayed for a repeated `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCard'
        '400':
          description: No `Idempotency-Key` header (`IDEMPOTENCY_KEY_REQUIRED`) or a too long one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE`: `RETRY` is not among the actions now (see above).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidState:
                  value:
                    title: Action is not allowed in the current state
                    status: 409
                    detail: Delivery of request DR-000123 is ACKNOWLEDGED; only FAILED or UNKNOWN can be retried
                    instance: /api/requests/0195f3a2-7c41-7d10-9a5e-3f1c2b4d5e60/retry
                    code: INVALID_STATE
        '422':
          description: The `Idempotency-Key` was already used for another action or request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/requests/{id}/reconcile:
    parameters:
      - name: id
        in: path
        required: true
        description: Request id. A malformed id answers `404`, like a missing request.
        schema:
          type: string
    post:
      tags: [problems]
      operationId: reconcileRequest
      summary: Reconcile now
      security:
        - session: []
          csrf: []
      description: |
        Operators of the request's service only; any state. Asks the carrier about the request's operation right
        now and acts as background reconciliation does: confirms the delivery if the carrier knows it, takes the
        carrier's result over if we have none, opens `EXTERNAL_MISSING` or `RECONCILIATION_CONFLICT` for an
        operator. A carrier that does not answer is an outcome too (`ERROR`), not an error of this call. The
        card requested after the response already shows what the check changed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated key of this action, at most 100 characters. A repeat with the same key returns the
            recorded check and does not ask the carrier again; send a new key to check again.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The recorded check, or the replay of an earlier check with the same key.
          headers:
            Idempotent-Replayed:
              description: '`true` when this response was replayed for a repeated `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
              examples:
                ahead:
                  $ref: '#/components/examples/ReconciliationAhead'
        '400':
          description: No `Idempotency-Key` header (`IDEMPOTENCY_KEY_REQUIRED`) or a too long one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The `Idempotency-Key` was already used for another action or request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/requests/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        description: Request id. A malformed id answers `404`, like a missing request.
        schema:
          type: string
    get:
      tags: [requests]
      operationId: getRequestHistory
      summary: History of a request
      description: |
        One feed of the request's changes and its exchange with the carrier, newest first. Whoever sees the
        request sees its history: an operator of its service sees everything, its initiator sees the business
        part only (`CREATED`, `EDITED`, `RESULT_CHANGED`, `DELIVERY_ACKNOWLEDGED`) without links to carrier records
        and problems. Entries of one instant follow cause (an attempt before the acknowledgement it brought, a
        result before its problem). An entry is identified by `kind` and `id` together.
      parameters:
        - name: before
          in: query
          description: '`nextCursor` of the previous page; the newest entries when omitted.'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: One page of the history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              examples:
                operator:
                  $ref: '#/components/examples/HistoryPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/problems:
    get:
      tags: [problems]
      operationId: listProblems
      summary: Problems of the exchange
      description: |
        Operators only. Problems of the requests of the caller's service, and problems of carrier records
        that name no known request (every operator sees those). Newest first (`openedAt`, then `id`).
      parameters:
        - name: status
          in: query
          description: '`ALL` — open and resolved.'
          schema:
            type: string
            enum: [OPEN, RESOLVED, ALL]
            default: OPEN
        - name: kind
          in: query
          description: One or more kinds (`kind=A&kind=B`); every kind when omitted.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProblemKind'
        - name: page
          in: query
          description: Page number, from 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of problems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeProblemPage'
              examples:
                conflict:
                  $ref: '#/components/examples/ProblemPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/problems/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Problem id. A malformed id answers `404`, like a missing problem.
        schema:
          type: string
    get:
      tags: [problems]
      operationId: getProblem
      summary: One problem
      description: |
        Operators only, in the scope of the list: problems of the requests of the caller's service and problems of
        carrier records that name no known request. A problem of another service answers `404`, like a missing one.
      responses:
        '200':
          description: The problem, the same as its item in the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such problem in the caller's scope.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/problems/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        description: Problem id. A malformed id answers `404`, like a missing problem.
        schema:
          type: string
    post:
      tags: [problems]
      operationId: resolveProblem
      summary: Decide on a problem
      security:
        - session: []
          csrf: []
      description: |
        Operators only; a problem of another service answers `404`. The decision must be one of the problem's
        `actions`: `APPLY_CARRIER` (replace the request's result with the carrier's final result) or `KEEP_OURS`
        for `RESULT_CONFLICT` and `RECONCILIATION_CONFLICT` (`APPLY_CARRIER` only while the carrier's side is a
        final result); `KEEP_OURS` for `EXTERNAL_MISSING` while the request has a final result; `ACKNOWLEDGED`
        for `INVALID_MESSAGE` and `MESSAGE_FAILED`. Delivery problems, and `EXTERNAL_MISSING` without a result,
        are closed by the system or by retrying the delivery. `APPLY_CARRIER` bumps the request's `version`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key of this action, at most 100 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveProblem'
            examples:
              keep:
                value:
                  decision: KEEP_OURS
                  comment: Перевозчик подтвердил прежний номер
      responses:
        '200':
          description: The problem after the decision, or the replay of an earlier decision with the same key.
          headers:
            Idempotent-Replayed:
              description: '`true` when this response was replayed for a repeated `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeProblem'
        '400':
          description: Invalid body, or no `Idempotency-Key` header (`IDEMPOTENCY_KEY_REQUIRED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such problem in the caller's scope.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`INVALID_STATE`: the problem is resolved already, or the decision is not one of its `actions`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The `Idempotency-Key` was already used for another action or problem.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: Server session created by `POST /api/auth/login`.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the `XSRF-TOKEN` cookie; required on every `POST` and `PATCH`.

  responses:
    ValidationFailed:
      description: The request is malformed or violates the rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              $ref: '#/components/examples/ValidationFailed'
    Unauthenticated:
      description: Not signed in, or the session has expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                title: Authentication required
                status: 401
                detail: Sign in first
                instance: /api/requests
                code: UNAUTHENTICATED
    Forbidden:
      description: '`CSRF_INVALID` — missing or wrong CSRF token; `FORBIDDEN` — not allowed for the caller''s role.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrf:
              value:
                title: Missing or invalid CSRF token
                status: 403
                detail: Missing or invalid CSRF token
                instance: /api/requests
                code: CSRF_INVALID
            denied:
              value:
                title: Access denied
                status: 403
                detail: Only operators can list operators
                instance: /api/users/operators
                code: FORBIDDEN
    NotFound:
      description: No such request in the caller's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                title: Not found
                status: 404
