spring:
  application:
    name: exchange-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:exchange}}
    username: ${DB_USER:exchange}
    password: ${DB_PASSWORD:exchange}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # the schema is owned by Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Europe/Moscow}

logging:
  level:
    root: INFO
    com.acme.exchange: ${LOG_LEVEL:INFO}
