spring:
  application:
    name: dispatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:dispatch}}
    username: ${DB_USER:dispatch}
    password: ${DB_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # Send worker and feed poller run in parallel: a slow send must not delay reading results.
        size: 2

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Europe/Moscow}
  carrier:
    base-url: ${CARRIER_URL:http://localhost:8081}
    connect-timeout: ${CARRIER_CONNECT_TIMEOUT:2s}
    read-timeout: ${CARRIER_READ_TIMEOUT:5s}
  exchange:
    enabled: ${EXCHANGE_ENABLED:true}

logging:
  level:
    root: INFO
    com.acme.dispatch: ${LOG_LEVEL:INFO}
