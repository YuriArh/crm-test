server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: a recreated dispatch container gets a new IP, and a hostname
    # in a plain proxy_pass is resolved only once at startup (502 until web is restarted).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dispatch http://dispatch:8080;

    # The API lives on the same origin, so session and CSRF cookies work without CORS.
    location /api/ {
        proxy_pass $dispatch;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every other path is a client route; index.html is always revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
